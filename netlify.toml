# Preview deployment for the one-pager experiment.
#
# Only the frontend is deployed here. Supabase and the Guesty edge functions
# stay where they are — this build talks to the same backend the Lovable
# preview does, so the deployed site shows real listings and live availability.
# The VITE_ variables it needs are committed in .env, so nothing has to be
# configured in the Netlify UI.

[build]
  # `npm run build` is a client build followed by scripts/prerender.mjs, which
  # drives a headless Chromium over every public route and writes the rendered
  # HTML back into dist/. Playwright's browser is not in node_modules, so it is
  # fetched first; this adds a couple of minutes and a few hundred MB to the
  # build, which is the price of the site being readable without JavaScript.
  #
  # The prerender step exits non-zero if any route fails to render, so a build
  # that would have shipped an empty shell fails here instead of in search
  # results.
  command = "npx playwright install chromium && npm run build"
  publish = "dist"

[build.environment]
  # Matches the version the build was verified on. Vite 5 needs 18+.
  NODE_VERSION = "22"

# react-router resolves every route in the browser, but the server only has
# index.html to serve. Without this rule a direct hit on /properties — or a
# /property/<slug> link shared with the client — returns 404, and only the bare
# "/" would work. status 200 rewrites rather than redirects, so the URL stays
# intact for the router to read.
#
# Prerendering does not replace this rule, and the two do not fight: Netlify
# looks for a matching file before applying a redirect, so /property-management
# is served from dist/property-management/index.html — the prerendered one —
# while anything without a file still falls through to the SPA shell. That
# ordering is what makes the whole approach work, so do not add `force = true`
# here: it would make every request take the shell and throw away every
# prerendered page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
