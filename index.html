<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontier Residences | Luxury Property Management & Investment Services</title>
    <meta name="description" content="Bespoke property management, renovation, and investment solutions for exclusive villas and apartments in Spain, Austria, and Croatia." />
    <meta name="author" content="Frontier Residences" />
    <link rel="icon" href="/favicon.png" type="image/png">
    <!-- Fonts are bundled via @fontsource in src/index.css. Do not add a
         stylesheet link back to a font CDN here: that hands the visitor's IP
         to a third party before anything renders. See the note in index.css. -->

    <!-- Site-level fallbacks only. Per-page title, description, canonical,
         og: and twitter: tags come from <Seo> (react-helmet-async).

         og:title, og:description and twitter:title/description are NOT set
         here on purpose: Helmet appends rather than replaces static tags, so
         leaving them would give every page two of each, and a parser that
         takes the first would always read the generic one.

         ⚠️ Known limit: WhatsApp, LinkedIn and Facebook do not execute
         JavaScript, so they only ever see this file. Per-page previews need
         prerendering or SSR — logged in the SEO audit. Google does render JS
         and will see the Helmet values. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Frontier Residences" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@FrontierResidences" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
