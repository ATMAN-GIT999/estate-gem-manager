<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontier Residences | Luxury Property Management & Investment Services</title>
    <meta name="description" content="Bespoke property management, renovation, and investment solutions for exclusive villas and apartments in Spain and Austria." />
    <meta name="author" content="Frontier Residences" />
    <link rel="icon" href="/favicon.png" type="image/png">
    <!-- Every other face on the site is self-hosted via @fontsource in
         src/index.css for exactly the reason this used to warn about: a
         fonts.googleapis.com request hands the visitor's IP to Google before
         the page renders, which is a GDPR problem for a business with an
         Austrian office and Austrian clients.

         This one link is a deliberate, scoped exception — Almedin's explicit
         call (02.10.2026) to pull Manrope in for the property-management
         page's body text, matching the Lovable "GitHub Gem Manager"
         reference 1:1, after being told what the self-hosted alternative
         would cost. Do not copy this pattern onto another page without the
         same conversation. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Site-level fallbacks only. Per-page title, description, canonical,
         og: and twitter: tags come from <Seo> (react-helmet-async).

         og:title, og:description and twitter:title/description are NOT set
         here on purpose: Helmet appends rather than replaces static tags, so
         leaving them would give every page two of each, and a parser that
         takes the first would always read the generic one.

         ⚠️ Known limit: WhatsApp, LinkedIn and Facebook do not execute
         JavaScript, so they only ever see this file. Per-page previews need
         prerendering or SSR — logged in the SEO audit. Google does render JS
         and will see the Helmet values. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Frontier Residences" />
    <meta property="og:image" content="https://frontier-residences.com/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@FrontierResidences" />
    <meta name="twitter:image" content="https://frontier-residences.com/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
